# Rate-limit zones for the repo-managed proxies (nginx-yahoo-proxy.conf and
# nginx-lead-proxy.conf).
#
# THIS FILE MUST BE LOADED IN THE http{} CONTEXT. limit_req_zone is only valid
# directly inside http{} — NOT in a server{}/location{} or a vhost-included
# snippet. So this cannot live in the proxy snippets (which are included inside
# the server block); it ships separately and gets dropped into
# /etc/nginx/conf.d/, which the stock nginx.conf auto-includes inside http{}:
#
#   ln -s /var/www/obsidian-quant/deploy/nginx-ratelimit.conf \
#         /etc/nginx/conf.d/obsidian-ratelimit.conf     # or copy it
#
# Each proxy's `limit_req zone=<name> ...;` references a zone below by name, so
# this file must be in place BEFORE the vhost's include of a proxy snippet is
# validated — otherwise `nginx -t` fails with e.g.
#   unknown limit_req_zone "yahoo_proxy"
# One install covers BOTH vhosts (they share these zones).

# Yahoo Finance quotes proxy.
# Sizing rationale: the app polls ~4 symbols (src/lib/marketQuotes.ts) every
# ~45s per client — ~0.09 r/s steady-state, with all four requests firing
# together on each refresh. rate=5r/s per source IP plus the burst set on the
# limit_req directive comfortably clears a real refresh spike, while capping
# scripted abuse that would turn this host into a Yahoo DoS relay. 10m of shared
# memory tracks ~160k distinct client IPs.
limit_req_zone $binary_remote_addr zone=yahoo_proxy:10m rate=5r/s;

# CRM lead-intake proxy (nginx-lead-proxy.conf).
# Sizing rationale: /api/lead is a human contact form — a handful of submits per
# IP per minute at the very most. rate=10r/m (one every ~6s sustained) per source
# IP plus burst=5 nodelay on the limit_req directive clears an accidental
# double-submit while tightly capping scripted abuse of the secret-injecting
# proxy; sustained excess gets 503. 10m tracks ~160k distinct client IPs.
limit_req_zone $binary_remote_addr zone=lead_intake:10m rate=10r/m;
