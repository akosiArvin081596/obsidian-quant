# CRM lead intake — same-origin proxy that injects the bearer secret server-side.
# Include inside the HTTPS server block for obsidianquantgroup.com (and the
# preview vhost obsidian.abedubas.dev), e.g.:
#
#   include /var/www/obsidian-quant/deploy/nginx-lead-proxy.conf;
#
# The browser POSTs the contact lead to same-origin /api/lead
# (src/lib/contact.ts -> CRM_WEBHOOK_URL, default "/api/lead"); nginx attaches
# `Authorization: Bearer <LEAD_INTAKE_SECRET>` server-side and forwards it to the
# CRM webhook. The secret NEVER reaches the client bundle (the site is a static
# SPA — anything shipped to the browser is public). connect-src stays 'self'
# (same-origin), so no CSP change is needed. Pair with nginx-security-headers.conf.
#
# --- DRAFT — pending the alchemydev-crm engineer's hand-back -------------------
# TODO(crm-contract): the CRM production host and the final webhook path below are
# PLACEHOLDERS. Fill CRM_HOST_TBD with the real host and confirm the path is
# /api/webhooks/leads from the CRM hand-back (see docs/crm-lead-intake-brief.md,
# "HAND BACK") BEFORE wiring this include into either vhost.
# ------------------------------------------------------------------------------

# Exact-match the single endpoint the app calls. `= /api/lead` is a fast exact
# match and refuses to relay any other path to the CRM (no open relay).
location = /api/lead {
    # POST only. The app never issues anything else here. Unlike the Yahoo proxy
    # (limit_except -> 403), a defined resource hit with the wrong method is a
    # 405 Method Not Allowed. `if { return ... }` is one of the documented-safe
    # uses of `if` in a location. The browser fetch is fire-and-forget and
    # swallows non-2xx, so this stays invisible to legitimate users.
    if ($request_method != POST) {
        add_header Allow "POST" always;
        return 405;
    }

    # TODO(crm-contract): replace CRM_HOST_TBD with the CRM production host and
    # confirm the path. Kept a LITERAL (not an nginx variable) on purpose so nginx
    # resolves the upstream at config-load time and needs no `resolver` directive.
    proxy_pass https://CRM_HOST_TBD/api/webhooks/leads;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    # Inject the shared bearer secret SERVER-SIDE. $lead_intake_bearer is defined
    # in a server-only file that is deliberately NOT in this repo:
    #   /etc/nginx/conf.d/obsidian-lead-secret.conf   (chmod 600, uncommitted)
    #   map "" $lead_intake_bearer { default "<LEAD_INTAKE_SECRET>"; }
    # The repo NEVER contains the secret value — only the variable name. See DEPLOY.md.
    proxy_set_header Authorization "Bearer $lead_intake_bearer";

    # With a literal host in proxy_pass, nginx derives both the Host header and TLS
    # SNI from CRM_HOST_TBD, so no explicit Host is set here. Forward JSON only.
    proxy_set_header Content-Type "application/json";
    proxy_set_header Accept "application/json";
    proxy_set_header Connection "";

    # Do not forward the visitor's cookies/auth to the CRM.
    proxy_set_header Cookie "";

    # Pass the real client IP through for the CRM's own rate-limit / dedup.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sane timeouts — a single small JSON POST; fail fast rather than hang the
    # browser's detached best-effort fetch.
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Rate-limit per client IP. A human contact form is low-volume; burst=5
    # nodelay absorbs an accidental double-submit (serve immediately instead of
    # queuing), and sustained excess is rejected with 503 — this proxy holds a
    # secret, so cap scripted abuse of it. The lead_intake zone is declared in
    # deploy/nginx-ratelimit.conf, which MUST be loaded at http{} context
    # (limit_req_zone is http-only) — see that file and DEPLOY.md.
    limit_req zone=lead_intake burst=5 nodelay;
}
