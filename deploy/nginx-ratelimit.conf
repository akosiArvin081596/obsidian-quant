# Rate-limit zone for the Yahoo Finance quotes proxy (nginx-yahoo-proxy.conf).
#
# THIS FILE MUST BE LOADED IN THE http{} CONTEXT. limit_req_zone is only valid
# directly inside http{} — NOT in a server{}/location{} or a vhost-included
# snippet. So this cannot live in nginx-yahoo-proxy.conf (which is included
# inside the server block); it ships separately and gets dropped into
# /etc/nginx/conf.d/, which the stock nginx.conf auto-includes inside http{}:
#
#   ln -s /var/www/obsidian-quant/deploy/nginx-ratelimit.conf \
#         /etc/nginx/conf.d/obsidian-ratelimit.conf     # or copy it
#
# The proxy's `limit_req zone=yahoo_proxy ...;` references this zone by name, so
# this file must be in place BEFORE the vhost's include of nginx-yahoo-proxy.conf
# is validated — otherwise `nginx -t` fails with
#   unknown limit_req_zone "yahoo_proxy"
#
# Sizing rationale: the app polls ~4 symbols (src/lib/marketQuotes.ts) every
# ~45s per client — ~0.09 r/s steady-state, with all four requests firing
# together on each refresh. rate=5r/s per source IP plus the burst set on the
# limit_req directive comfortably clears a real refresh spike, while capping
# scripted abuse that would turn this host into a Yahoo DoS relay. 10m of shared
# memory tracks ~160k distinct client IPs.
limit_req_zone $binary_remote_addr zone=yahoo_proxy:10m rate=5r/s;

# Rate-limit zone for the lead-intake proxy (nginx-lead-proxy.conf). A contact
# form is submitted rarely, so a low steady rate with a small burst is ample and
# caps scripted abuse of the CRM webhook. Same http{}-context install as above —
# the vhost include of nginx-lead-proxy.conf fails `nginx -t` with
# `unknown limit_req_zone "lead_proxy"` if this file isn't in conf.d/.
limit_req_zone $binary_remote_addr zone=lead_proxy:10m rate=20r/m;

# Rate-limit zone for the public blog API (consumed by the `location /api/public/`
# block in nginx-next-proxy.conf). Two unauthenticated routes accept writes:
#
#   POST /api/public/posts/<slug>/comments   -> Comment row created per request
#                                               (src/app/api/public/posts/[slug]/comments/route.ts)
#   POST /api/public/newsletter/subscribe    -> NewsletterSubscriber upsert per request
#                                               (src/app/api/public/newsletter/subscribe/route.ts)
#
# Neither is an injection vector — the comment body is run through sanitize-html
# with allowedTags:[] and stored status:"pending", so nothing reaches a reader
# without moderator approval. The exposure is VOLUME: with no throttle a single
# script can create rows until the disk or the moderators give out, and the
# newsletter upsert lets one client churn the subscriber table indefinitely.
#
# WHY THE KEY IS A map AND NOT $binary_remote_addr DIRECTLY
# ---------------------------------------------------------
# /api/public/ is NOT a write-only prefix. Five of its seven routes are GET reads
# that the site issues during ordinary browsing:
#
#   GET /api/public/config/ga/               every page load  (src/components/GoogleAnalytics.tsx)
#   GET /api/public/posts/<slug>/comments/   every article view (src/components/blog/ArticleComments.tsx)
#   GET /api/public/posts, /posts/<slug>, /categories, /tags
#
# A limit keyed on $binary_remote_addr alone would meter those reads too, so a
# reader clicking through several articles — or an office/CGNAT egress IP shared
# by many readers — would start collecting 429s on the blog itself. That is a
# self-inflicted outage in exchange for no extra safety, because reads create
# nothing.
#
# The map below therefore resolves to the client address for anything that is not
# a known-safe read method, and to an EMPTY STRING for GET/HEAD/OPTIONS. nginx
# documents that "requests with an empty key value are not accounted", so reads
# never enter the zone, never occupy a slot, and can never be rejected by it. The
# limit lands on exactly the traffic that mutates the database.
#
# The mapping is deliberately FAIL-CLOSED: `default` is the limited case and only
# the three read verbs are exempted, so any method we did not enumerate (a verb
# added by a future route, an odd-cased or non-standard token) is rate-limited
# rather than silently waved through. Listing the write verbs instead would make
# every unlisted method a free bypass.
#
# map is, like limit_req_zone, valid ONLY in the http{} context — so it has to
# live in this file and cannot move into the vhost-included proxy snippet.
map $request_method $public_api_write_addr {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

# Sizing rationale — RATE: a write here is a human filling in a form. The comment
# box takes tens of seconds to type and the newsletter field is submitted once
# per visitor, so genuine sustained write traffic from one address is far below
# 1r/m. rate=10r/m (one write per 6s) leaves roughly a 5x margin over the fastest
# plausible human and still caps a determined single address at ~600 rows/hour
# instead of an open tap. It sits a little tighter than lead_proxy's 20r/m on
# purpose: a public comment box attracts far more automated spam than a contact
# form, and unlike the lead proxy every accepted request lands in a queue a human
# has to clear. The burst that absorbs several people submitting at once is set
# on the limit_req directive in nginx-next-proxy.conf.
#
# Sizing rationale — MEMORY: states are 128 bytes on this 64-bit host, so 1m holds
# ~8k of them and 5m holds ~40k. Because reads map to an empty key, ONLY addresses
# that actually attempt a write ever occupy a slot — a fraction of a percent of
# traffic — so this does not need the 10m the read-path zones above use, which
# matters on a box shared with many other services. 40k concurrent writing
# addresses is still far past any real spam wave; if the zone were ever exhausted
# nginx evicts least-recently-used entries and rejects the overflow, which fails
# closed on writes while leaving reads (not accounted) completely untouched.
#
# INSTALL NOTE — this zone is newer than the two above, so a host whose
# /etc/nginx/conf.d/obsidian-ratelimit.conf is a stale COPY rather than a symlink
# to this file will fail `nginx -t` the moment the new nginx-next-proxy.conf
# lands, with:
#   [emerg] zero size shared memory zone "public_api"
# (older nginx wrote this as `unknown limit_req_zone`; the above is what 1.28
# prints). On the production VPS that path was checked and IS a symlink to this
# file, so the zone ships with the repo checkout and needs no manual step there —
# but verify with `ls -la /etc/nginx/conf.d/` before assuming it on any other
# host, because the failure mode is a blocked reload, not a silent no-op.
limit_req_zone $public_api_write_addr zone=public_api:5m rate=10r/m;
