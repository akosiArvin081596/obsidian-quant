# Reverse-proxy the Next.js Node process (CMS + SSR blog).
# Keep Yahoo + lead includes BEFORE this catch-all so those locations win.
#
# Defines TWO locations against the same upstream: a rate-limited /api/public/
# (see deploy/nginx-ratelimit.conf, zone public_api) and the catch-all /. The
# proxy_* directives are duplicated between them because nginx does not inherit
# them across sibling locations — change one, change both.
#
# Requires: PM2/systemd running `next start` on 127.0.0.1:3006 (PORT=3006).
# Port 3006 chosen because 3000-3005 are already in use on this VPS.
#           (or set $obsidian_upstream differently)

# Public blog API — same upstream as the catch-all below, but rate-limited.
#
# This exists because two routes under this prefix take unauthenticated writes:
# POST /api/public/posts/<slug>/comments creates a Comment row per request and
# POST /api/public/newsletter/subscribe upserts a subscriber, and until this
# block existed neither had any throttle in front of it. See the public_api
# section of deploy/nginx-ratelimit.conf for the full threat note and the rate.
#
# The zone counts ONLY write methods (its key is a map over $request_method that
# returns an empty string for GET/HEAD/OPTIONS, and nginx does not account empty
# keys), which matters here because most of this prefix is read traffic the site
# issues on every page view. So this block is safe to hang over the whole
# /api/public/ tree: readers are proxied exactly as before and never metered.
#
# Location precedence: nginx picks the LONGEST matching prefix, not the first one
# in file order, so /api/public/* lands here rather than in `location /` no
# matter where this sits. It is placed above the catch-all only to match the
# convention noted at the top of this file. There are no regex locations in the
# obsidian includes, so nothing can override this match.
location /api/public/ {
    # Reject oversized bodies at nginx instead of streaming them into Node. The
    # only writes here are small JSON documents — the handler already truncates a
    # comment to 5000 chars / a name to 120 / an email to 200 — so 64k is orders
    # of magnitude more than any legitimate request needs. Deliberately NOT the
    # 55m the catch-all allows: that allowance exists for CMS media uploads under
    # /api/admin/media and has no business on an unauthenticated endpoint. If a
    # future /api/public/ route ever accepts a file, raise this or give it its own
    # location, otherwise it will 413.
    client_max_body_size 64k;

    # Proxy exactly as `location /` does — nginx does not inherit these from a
    # sibling location, so they are restated in full. Keep IN SYNC with the
    # catch-all below: dropping any one of these changes what the app sees
    # (Host/X-Forwarded-Proto drive Next.js URL construction, and
    # X-Real-IP/X-Forwarded-For are how the routes see the true client address
    # rather than 127.0.0.1). Timeouts are intentionally left at nginx defaults
    # rather than copied: the catch-all's 120s exists for large media uploads,
    # and a JSON read that needs more than a minute is a bug, not a slow client.
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # NOTE: no add_header directives here, on purpose. add_header inheritance is
    # per-level and all-or-nothing, so adding even one here would drop every
    # header from nginx-security-headers.conf on /api/public/ responses. With
    # none set, the server-level headers are inherited intact — unlike the
    # yahoo/lead proxies, which must restate them because they override
    # Cache-Control.

    # 429 rather than nginx's default 503: these routes are called from fetch()
    # in the browser, and "Too Many Requests" is what a client (and our own
    # monitoring) needs to distinguish backpressure from a broken upstream. Scoped
    # to this location so the yahoo/lead proxies keep their documented 503.
    limit_req_status 429;

    # burst=10 nodelay: serve a short spike immediately instead of queueing it to
    # the 10r/m rate. Ten absorbs a genuine cluster — several readers behind one
    # office/CGNAT address submitting comments around the same time, or a visitor
    # who comments and then subscribes — while sustained abuse past the burst is
    # rejected. The public_api zone is declared in deploy/nginx-ratelimit.conf,
    # which MUST be loaded at http{} context (limit_req_zone is http-only); if
    # conf.d/ is missing that file, or still holds a copy predating this zone,
    # `nginx -t` fails with
    #   [emerg] zero size shared memory zone "public_api"
    # and the deploy's reload step aborts. (Older nginx worded that "unknown
    # limit_req_zone"; the message above is what 1.28 — the version on the VPS —
    # actually prints. Verified.) See that file and DEPLOY.md.
    limit_req zone=public_api burst=10 nodelay;
}

location / {
    # CMS media upload allows images up to 8MB and videos up to 50MB (see api/admin/media).
    # nginx defaults to 1MB — without this, uploads return HTML 413 and the editor shows
    # "Unexpected token '<' … is not valid JSON".
    client_max_body_size 55m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
