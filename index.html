<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/assets/obsidian-gem.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />
    <!--
      CSP connect-src is a strict allowlist ('self' + FormSubmit + Google Analytics)
      — the bare `https:` wildcard (which permitted exfil to ANY https origin) has been removed.
      ws:/wss: are retained solely for the Vite dev-server HMR socket; production is
      further locked down by deploy/nginx-security-headers.conf (which omits ws:/wss:)
      — that header intersects with this meta, so websockets stay blocked in prod.
      When VITE_CRM_WEBHOOK_URL is configured, that webhook's origin MUST be added
      to connect-src below, otherwise the optional CRM fetch will be CSP-blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' ws: wss: https://formsubmit.co https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com"
    />
    <meta
      name="description"
      content="Obsidian Quant Group — a quantitative investment architecture combining multi-layer systematic trading, institutional infrastructure, and absolute risk discipline. Profit from market dislocation."
    />

    <!-- Social -->
    <meta property="og:title" content="Obsidian Quant Group | Profit from Market Dislocation" />
    <meta
      property="og:description"
      content="Institutional quantitative asset management. Beyond the Market. Within the Model."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Cormorant Garamond (display) + Montserrat (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Obsidian Quant Group | Profit from Market Dislocation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
