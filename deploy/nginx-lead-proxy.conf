# Lead intake — same-origin POST /api/lead → alchemydev-crm lead webhook.
# Include inside the HTTPS server block for BOTH vhosts, e.g.:
#
#   include /etc/nginx/snippets/obsidian-lead-secret.conf;   # NON-committed; see below
#   include /var/www/obsidian-quant/deploy/nginx-lead-proxy.conf;
#
# The browser POSTs same-origin /api/lead (src/lib/contact.ts → CRM_WEBHOOK_URL,
# default "/api/lead"); nginx forwards it to the CRM server-side and INJECTS the
# shared bearer secret, so the secret never reaches the client bundle. connect-src
# 'self' already covers /api/lead — no CSP change needed.
#
# SECRET (never committed): this snippet reads $lead_intake_secret. Define it in a
# root-only file included in the SAME server block, e.g.
#   # /etc/nginx/snippets/obsidian-lead-secret.conf   (chmod 600, NOT in the repo)
#   set $lead_intake_secret "<the shared LEAD_INTAKE_SECRET>";
# If the variable is undefined, `nginx -t` fails loudly (unknown variable) — a
# deliberate fail-closed so a misconfigured host can't send an empty bearer.
#
# CRM host: the alchemydev-crm public origin. Change here if the CRM moves.
location = /api/lead {
    # The app only ever POSTs a lead; refuse everything else.
    limit_except POST { deny all; }

    proxy_pass https://ups.alchemydev.io/api/webhooks/leads;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    proxy_set_header Host ups.alchemydev.io;
    # Inject the shared secret; this OVERRIDES any Authorization the browser sent.
    proxy_set_header Authorization "Bearer $lead_intake_secret";
    proxy_set_header Content-Type "application/json";
    proxy_set_header Accept "application/json";
    proxy_set_header Connection "";
    # Do not forward the visitor's cookies to the CRM.
    proxy_set_header Cookie "";
    # Forward the real client IP for the CRM's logs/rate-limit context.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_connect_timeout 8s;
    proxy_send_timeout 12s;
    proxy_read_timeout 12s;

    # Strip the CRM's response headers so the ones we set below are the only copy
    # the client sees (mirrors nginx-yahoo-proxy.conf — add_header inheritance is
    # per-level and all-or-nothing, so this location must restate them).
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;

    # An API response must never be cached.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://formsubmit.co https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate-limit per client IP — a contact form submits a handful of times at
    # most. The lead_proxy zone is declared in deploy/nginx-ratelimit.conf, which
    # MUST be loaded at http{} context (limit_req_zone is http-only) — see that
    # file and DEPLOY.md.
    limit_req zone=lead_proxy burst=5 nodelay;
}
