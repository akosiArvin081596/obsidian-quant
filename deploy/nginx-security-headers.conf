# Include this file from the HTTPS server block for obsidian.abedubas.dev.
# CSP is also present as an HTML meta policy; the HTTP header adds directives
# that browsers do not honor from meta tags, including frame-ancestors.
# connect-src is an allowlist: 'self' covers the same-origin /api/yahoo AND
# /api/lead proxies; https://formsubmit.co is the contact form; Google Analytics
# hosts are required for gtag.js (G-VSGHTHYWHD). The default lead intake needs
# NO change (it's same-origin /api/lead). NOTE: only if you override
# Override NEXT_PUBLIC_CRM_WEBHOOK_URL to a DIFFERENT origin (e.g. https://hooks.zapier.com) must
# that origin be added to connect-src here, or the CRM fetch is CSP-blocked. Keep
# this in sync with the index.html meta CSP.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://formsubmit.co https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
