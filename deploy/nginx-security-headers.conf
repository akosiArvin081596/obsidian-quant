# Include this file from the HTTPS server block for obsidian.abedubas.dev.
# CSP is also present as an HTML meta policy; the HTTP header adds directives
# that browsers do not honor from meta tags, including frame-ancestors.
# connect-src is an allowlist: 'self' covers the same-origin /api/yahoo proxy;
# https://formsubmit.co is the contact form. NOTE: when VITE_CRM_WEBHOOK_URL is
# configured, that webhook's origin (e.g. https://hooks.zapier.com) must be added
# to connect-src here, or the CRM fetch will be CSP-blocked. Keep this in sync
# with the index.html meta CSP.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://formsubmit.co" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
