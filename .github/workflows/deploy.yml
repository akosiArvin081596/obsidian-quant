name: Deploy to VPS

# Pushes to main trigger a build-and-deploy on the VPS (obsidian.abedubas.dev).
# The SSH key is locked to a forced command on the server, so this job can only
# run the deploy script — it has no shell access.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-obsidian
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deploy over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "deploy" && exit 0
            echo "::warning::deploy attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::deploy failed after 5 attempts"
          exit 1
