name: Deploy to VPS

# Pushes to main trigger a build-and-deploy on the VPS (obsidian.abedubas.dev).
# The SSH key is locked to a forced command on the server, so this job can only
# run the deploy script — it has no shell access.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-obsidian
  cancel-in-progress: false

# The job only opens an outbound SSH connection; it never reads the repo or the
# GITHUB_TOKEN, so it is granted no permissions at all.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deploy over SSH
        # Secrets are passed as env vars, not interpolated into the script text,
        # so their contents can never be parsed as shell (no injection) and an
        # unset VPS_KNOWN_HOSTS is caught by the emptiness guard below.
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          [ -n "$VPS_KNOWN_HOSTS" ] || { echo "::error::VPS_KNOWN_HOSTS is empty or unset"; exit 1; }
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          # Force IPv4 (-4). The VPS hostname resolves to BOTH an A and an AAAA
          # record; GitHub's dual-stack Azure runners otherwise sometimes try the
          # IPv6 address first, which Azure->Hostinger does not route, black-holing
          # the connection for the full ConnectTimeout on every attempt. The box's
          # IPv4 is the known-good path (host key is per-host, so StrictHostKey
          # checking against VPS_KNOWN_HOSTS is unaffected).
          for attempt in 1 2 3 4 5; do
            ssh -4 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$VPS_USER@$VPS_HOST" "deploy" && exit 0
            echo "::warning::deploy attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::deploy failed after 5 attempts"
          exit 1
