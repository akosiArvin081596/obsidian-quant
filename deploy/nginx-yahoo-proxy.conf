# Market Intelligence — reverse-proxy Yahoo Finance chart quotes.
# Include inside the HTTPS server block for obsidian.abedubas.dev, e.g.:
#
#   include /var/www/obsidian-quant/deploy/nginx-yahoo-proxy.conf;
#
# Browsers call same-origin /api/yahoo/...; nginx fetches Yahoo server-side
# (avoids CORS). Pair with nginx-security-headers.conf (connect-src 'self').

# Scope this to ONLY the chart endpoint the app actually calls
# (src/lib/marketQuotes.ts -> /api/yahoo/v8/finance/chart/<symbol>). A bare
# /api/yahoo/ prefix would relay Yahoo's entire API surface (v6/v7/v10/v11,
# quoteSummary, downloads, ...) and turn this host into an open Yahoo relay.
#
# proxy_pass URI mapping (prefix location + prefix proxy_pass): nginx replaces
# the matched location prefix with the proxy_pass URI and appends the rest of
# the request URI as-is, still percent-encoded (%5E stays %5E). Example:
#   browser:  /api/yahoo/v8/finance/chart/%5EVIX?range=5d&interval=1d
#   upstream: https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5d&interval=1d
# This is byte-for-byte the same upstream the old /api/yahoo/ -> / mapping
# produced for chart requests, so live quotes keep working unchanged.
location /api/yahoo/v8/finance/chart/ {
    # The app only ever issues GETs for quotes; refuse other methods.
    limit_except GET HEAD { deny all; }

    proxy_pass https://query1.finance.yahoo.com/v8/finance/chart/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    proxy_set_header Host query1.finance.yahoo.com;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
    proxy_set_header Accept "application/json,text/plain,*/*";
    proxy_set_header Connection "";

    # Do not forward the visitor's cookies/auth to Yahoo.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_headers on;

    proxy_connect_timeout 8s;
    proxy_send_timeout 12s;
    proxy_read_timeout 12s;

    # Short browser cache; quotes refresh every ~45s in the app.
    add_header Cache-Control "public, max-age=30" always;

    # Re-assert the security headers. Because this location defines its own
    # add_header directives, nginx does NOT inherit the server-level headers
    # from nginx-security-headers.conf (add_header inheritance is per-level and
    # all-or-nothing), so without these /api/yahoo/* responses ship header-less.
    # Restated (not `include`d) to avoid a duplicate X-Content-Type-Options.
    # Keep in sync with deploy/nginx-security-headers.conf.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://formsubmit.co" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # TODO(recommended): rate-limit this proxy. limit_req needs a limit_req_zone
    # declared in the http{} context (e.g. 5r/s per IP), which this included
    # snippet does not control; add the zone in the main nginx.conf, then
    # reference it here with e.g. `limit_req zone=yahoo burst=10 nodelay;`.
}
